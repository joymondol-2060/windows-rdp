name: Ubuntu-KDE-CRD

on:
  workflow_dispatch:
    inputs:
      crd_command:
        description: 'Chrome Remote Desktop Command'
        required: true
      pin:
        description: '6 Digit PIN'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Update System
        run: |
          sudo apt update

      - name: Install KDE Plasma
        run: |
          sudo apt install -y plasma-desktop

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Install Chrome Remote Desktop
        run: |
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo apt install -y ./chrome-remote-desktop_current_amd64.deb

      - name: Configure KDE Session
        run: |
          echo "export DESKTOP_SESSION=plasma" > ~/.chrome-remote-desktop-session
          echo "exec /usr/bin/startplasma-x11" >> ~/.chrome-remote-desktop-session
          chmod +x ~/.chrome-remote-desktop-session

      - name: Start Chrome Remote Desktop
        run: |
          PIN="${{ github.event.inputs.pin }}"
          CMD='${{ github.event.inputs.crd_command }}'
          eval "$CMD --pin=$PIN"

      - name: Show Hostname
        run: |
          echo "Hostname: $(hostname)"

      - name: Keep Alive
        run: |
          while true; do
            sleep 60
          done
