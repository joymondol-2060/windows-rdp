name: Ubuntu-KDE-CRD

on:
  workflow_dispatch:
    inputs:
      crd_command:
        description: 'Chrome Remote Desktop Command'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Install KDE Plasma
      run: |
        sudo apt update
        sudo apt install -y kde-plasma-desktop

    - name: Install Chrome Remote Desktop
      run: |
        wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
        sudo apt update
        sudo apt install -y ./chrome-remote-desktop_current_amd64.deb

    - name: Configure KDE Plasma
      run: |
        echo "export DESKTOP_SESSION=plasma" >> ~/.chrome-remote-desktop-session
        echo "exec /usr/bin/startplasma-x11" >> ~/.chrome-remote-desktop-session
        chmod +x ~/.chrome-remote-desktop-session

    - name: Start Chrome Remote Desktop
      run: |
        eval "${{ github.event.inputs.crd_command }}"

    - name: Keep Alive
      run: |
        while true; do
          sleep 60
        done
